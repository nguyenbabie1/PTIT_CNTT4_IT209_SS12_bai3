name: CD Multi Environment

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Simulate staging deployment
        run: echo "Staging deployment simulation completed."

  deploy-prod:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Simulate production deployment
        run: echo "Production deployment simulation completed after approval."
